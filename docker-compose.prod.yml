version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: wlwl-foundation-prod
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VUE_APP_BACKEND_URL=${VUE_APP_BACKEND_URL}
      - VUE_APP_IMAGE_UPLOAD_URL=${VUE_APP_IMAGE_UPLOAD_URL}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
