version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wlwl-foundation
    ports:
      - "5000:80"
    environment:
      - NODE_ENV=production
      - VUE_APP_I18N_LOCALE=en
      - VUE_APP_I18N_FALLBACK_LOCALE=en
      - VUE_APP_BACKEND_URL=${VUE_APP_BACKEND_URL}
      - VUE_APP_IMAGE_UPLOAD_URL=${VUE_APP_IMAGE_UPLOAD_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
